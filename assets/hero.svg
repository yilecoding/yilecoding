<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d">
  <title id="t">壹樂 · Jerry</title>
  <desc id="d">壹樂 · Jerry —— 全栈工程师，把 AI Agent 做进真实业务，深圳。Agent · RAG · MCP · Python / FastAPI · Java / Spring Boot · React / Vue。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#060910"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0" r="0.8">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#14b8a6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="1" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.6" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <mask id="gridMask">
      <rect width="1000" height="320" fill="url(#fade)"/>
    </mask>
    <clipPath id="card">
      <rect width="1000" height="320" rx="22"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .breathe { animation: breathe 7s ease-in-out infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes breathe { 0%,100% { opacity: .65 } 50% { opacity: 1 } }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect class="breathe" width="1000" height="320" fill="url(#glow)"/>
    <rect width="1000" height="320" fill="url(#glow2)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="319" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- 左：名字与定位 -->
  <circle class="pulse" cx="68" cy="72" r="4.5" fill="#34d399"/>
  <text class="mono" x="84" y="77" font-size="13" fill="#94a3b8" letter-spacing="2.4">YILECODING · SHENZHEN</text>

  <text class="sans" x="64" y="152" font-size="58" font-weight="700" fill="#f8fafc">壹樂 <tspan fill="url(#accent)">· Jerry</tspan></text>
  <text class="sans" x="66" y="196" font-size="22" fill="#cbd5e1">全栈工程师 · 把 AI Agent 做进真实业务</text>

  <text class="mono" x="66" y="252" font-size="14" fill="#64748b">Agent · RAG · MCP · FastAPI · Spring Boot · React</text>

  <!-- 右：终端卡片 -->
  <g transform="translate(610 64)">
    <rect width="326" height="192" rx="14" fill="#0b1324" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="22" cy="22" r="5" fill="#f87171" fill-opacity="0.8"/>
    <circle cx="40" cy="22" r="5" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="58" cy="22" r="5" fill="#34d399" fill-opacity="0.8"/>
    <text class="mono" x="22" y="66" font-size="13" fill="#64748b">$ <tspan fill="#e2e8f0">whoami</tspan></text>
    <text class="mono" x="22" y="92" font-size="13" fill="#34d399">agent <tspan fill="#64748b">→</tspan> <tspan fill="#e2e8f0">工具调用 · MCP · 审计</tspan></text>
    <text class="mono" x="22" y="116" font-size="13" fill="#2dd4bf">rag <tspan fill="#64748b">→</tspan> <tspan fill="#e2e8f0">多路检索 · 记忆压缩</tspan></text>
    <text class="mono" x="22" y="140" font-size="13" fill="#fbbf24">fullstack <tspan fill="#64748b">→</tspan> <tspan fill="#e2e8f0">后端 · 前端 · 多端</tspan></text>
    <text class="mono" x="22" y="170" font-size="13" fill="#64748b">$ <tspan class="cursor" fill="#e2e8f0">▍</tspan></text>
  </g>
</svg>
